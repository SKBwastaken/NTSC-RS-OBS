name: Flatpak build and sandbox test

on:
  pull_request:
    paths:
      - ".github/workflows/flatpak.yml"
      - "packaging/**"
      - "tests/**"
      - "native/**"
      - "src/**"
      - "vendor/**"
      - "Cargo.*"
      - "build.rs"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lock_json:
        description: "Optional saved runtime-lock.json contents for an exact rebuild"
        required: false
        type: string

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install test and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder ostree binutils python3 xvfb xauth dbus-x11
          # Disposable CI VM only. Ubuntu's host policy otherwise blocks bwrap.
          # Never change this policy on a developer's workstation in build.py.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test build automation
        run: python3 -m unittest discover -s tests -p 'test_flatpak.py'
      - name: Prepare or restore isolated pinned runtime
        env:
          LOCK_JSON: ${{ inputs.lock_json }}
        run: |
          if [ -n "$LOCK_JSON" ]; then
            mkdir -p dist/flatpak
            printf '%s\n' "$LOCK_JSON" > dist/flatpak/runtime-lock.json
            dbus-run-session -- python3 packaging/flatpak/build.py restore
          else
            dbus-run-session -- python3 packaging/flatpak/build.py prepare
          fi
      - name: Build, audit final bundle and test real OBS sandbox
        run: dbus-run-session -- python3 packaging/flatpak/build.py build
      # Only reached when every audit and sandbox check passed. The checkout is
      # the payload extracted from the final bundle, kept for the release review.
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-candidate
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/releases/*-Flatpak-x86_64.flatpak
            test-output/flatpak-report.json
            dist/flatpak/build-*/checkout/
      # Deliberately no release, installation into host OBS, repository write,
      # or external publication step.
